services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: roomline
      POSTGRES_PASSWORD: roomline_local
      POSTGRES_DB: roomline
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - roomline_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomline -d roomline"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  roomline_data:
